# DecodiumOS: FT8/FT4 need the clock within about half a second and FT2 is
# tighter still. Poll more often than the 2048 s default so drift after
# suspend, resume or a long portable session is corrected within minutes.
# (chrony cannot replace timesyncd here: AnduinOS desktop-core depends on it.)
[Time]
PollIntervalMaxSec=256
