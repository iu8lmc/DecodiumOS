# DecodiumOS desktop defaults, compiled into the AnduinOS system dconf
# database by the anduinos-dconf-runtime trigger. Keyfiles are merged in name
# order, so these keys override 05-app-folders.conf and the gschema defaults
# of anduinos-dconf-defaults. Existing user values always take precedence.
#
# Keep folder-children and favorite-apps in sync with the upstream lists when
# AnduinOS changes them; only the HamRadio / decodium entries are ours.

[org/gnome/desktop/app-folders]
folder-children=['System', 'Utilities', 'YaST', 'Pardus', 'HamRadio']

[org/gnome/desktop/app-folders/folders/HamRadio]
name='X-DecodiumOS-HamRadio.directory'
translate=true
categories=['HamRadio']

[org/gnome/shell]
favorite-apps=['firefox.desktop', 'org.gnome.Nautilus.desktop', 'org.gnome.Software.desktop', 'decodium.desktop']
