# DecodiumOS look: Decodium 4 "Ocean Blue" colours on top of the AnduinOS
# desktop. Keyfiles are merged in name order, so these keys override the
# AnduinOS defaults (10-arcmenu, 14-dash-to-panel, 20-wallpapers). Values a
# user has changed always take precedence.
#
# Palette: background #0A0F1A / #111827, primary #4A90E2, signal #00D4FF,
# decode accent #00FF88, text #E8F4FD.

[org/gnome/desktop/background]
picture-uri='file:///usr/share/backgrounds/decodiumos/decodiumos-light.png'
picture-uri-dark='file:///usr/share/backgrounds/decodiumos/decodiumos-dark.png'
primary-color='#0A0F1A'

[org/gnome/desktop/screensaver]
picture-uri='file:///usr/share/backgrounds/decodiumos/decodiumos-dark.png'
primary-color='#0A0F1A'

[org/gnome/desktop/interface]
accent-color='blue'
color-scheme='prefer-dark'

# Let the accent extension give libadwaita (GTK 4) apps the same Fluent
# style as GTK 3 apps; rebrand recolours that style to Decodium navy. With
# the AnduinOS default (false) GTK 4 apps keep stock grey Adwaita.
[org/gnome/shell/extensions/accent-gtk-theme]
set-link-gtk4=true

[org/gnome/shell/extensions/arcmenu]
override-menu-theme=true
menu-background-color='rgba(10,15,26,0.96)'
menu-foreground-color='rgb(232,244,253)'
menu-border-color='rgba(74,144,226,0.45)'
menu-separator-color='rgba(74,144,226,0.25)'
menu-item-hover-bg-color='rgba(74,144,226,0.22)'
menu-item-hover-fg-color='rgb(232,244,253)'
menu-item-active-bg-color='rgba(0,212,255,0.30)'
menu-item-active-fg-color='rgb(232,244,253)'
pinned-apps=[{'id': 'decodium.desktop'}, {'id': 'wsjtx.desktop'}, {'id': 'JS8Call.desktop'}, {'id': 'fldigi.desktop'}, {'id': 'flrig.desktop'}, {'id': 'gpredict.desktop'}, {'id': 'dk.gqrx.gqrx.desktop'}, {'id': 'firefox.desktop'}, {'id': 'org.gnome.Nautilus.desktop'}, {'id': 'org.gnome.Ptyxis.desktop'}, {'id': 'org.gnome.Software.desktop'}, {'id': 'org.gnome.TextEditor.desktop'}, {'id': 'org.gnome.Calculator.desktop'}, {'id': 'org.gnome.clocks.desktop'}, {'id': 'org.gnome.Weather.desktop'}, {'id': 'org.gnome.Loupe.desktop'}, {'id': 'org.gnome.Settings.desktop'}, {'id': 'anduinos-appearance.desktop'}]

[org/gnome/shell/extensions/dash-to-panel]
trans-use-custom-bg=true
trans-bg-color='#0A0F1A'
trans-use-custom-opacity=true
trans-panel-opacity=0.82
trans-use-border=true
trans-border-use-custom-color=true
trans-border-custom-color='rgba(74,144,226,0.40)'
dot-color-dominant=false
dot-color-override=true
dot-color-1='#00D4FF'
dot-color-2='#00D4FF'
dot-color-3='#00D4FF'
dot-color-4='#00D4FF'
focus-highlight-dominant=false
focus-highlight-color='#4A90E2'
